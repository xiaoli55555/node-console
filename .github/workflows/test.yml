name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/*.cjs
      - run: bash -n scripts/*.sh agent/install.sh
      - run: PANEL_DOMAIN=panel.example.com docker compose config --quiet
      - run: docker build --build-arg APP_COMMIT=${{ github.sha }} -t hk-sdan:test .
      - name: Container health smoke test
        run: |
          docker run -d --name hksdan-test -p 127.0.0.1:8080:8080 hk-sdan:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker logs hksdan-test
          exit 1
